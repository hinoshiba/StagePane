name: Feature request
description: Propose a focused, privacy-preserving improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact checklist
      options:
        - label: I considered screen-content privacy and permission timing.
          required: true
        - label: I considered App Sandbox and public-API constraints.
          required: true
        - label: I considered keyboard, VoiceOver, contrast, and Reduce Motion.
          required: true
        - label: I identified any dependency, asset, license, network, or recording impact.
          required: true
