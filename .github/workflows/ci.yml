name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip \
            --output "${RUNNER_TEMP}/xcodegen.zip"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  ${RUNNER_TEMP}/xcodegen.zip" \
            | shasum -a 256 --check
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Select the installed Xcode 16 SDK on macOS 14
        if: matrix.os == 'macos-14'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer' >> "$GITHUB_ENV"

      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Verify checked-in Xcode project is current
        run: ./Scripts/check-xcodegen-drift.sh

      - name: Audit and test
        run: ./Scripts/release-check.sh

      - name: Treat compiler warnings as errors
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build application bundle
        run: ./build.sh

      - name: Verify bundle and entitlements
        run: |
          BINARY="dist/StagePane.app/Contents/MacOS/StagePane"
          codesign --verify --strict --verbose=2 dist/StagePane.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/StagePane.app/Contents/Info.plist)" = com.hinoshiba.stagepane
          codesign -d --entitlements :- dist/StagePane.app > "$RUNNER_TEMP/local-development-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/local-development-entitlements.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' "$RUNNER_TEMP/local-development-entitlements.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$RUNNER_TEMP/local-development-entitlements.plist" 2>/dev/null || true)" != true
          test -s dist/StagePane.app/Contents/Resources/AppIcon.icns
          test -s dist/StagePane.app/Contents/Resources/PrivacyInfo.xcprivacy
          test -s dist/StagePane.app/Contents/Resources/en.lproj/InfoPlist.strings
          test -s dist/StagePane.app/Contents/Resources/ja.lproj/InfoPlist.strings
          test -s dist/StagePane.app/Contents/Resources/DEVELOPMENT_BUILD_DO_NOT_DISTRIBUTE.txt
          cmp -s LICENSE dist/StagePane.app/Contents/Resources/LICENSE.txt
          cmp -s NOTICE dist/StagePane.app/Contents/Resources/NOTICE.txt
          cmp -s THIRD_PARTY_NOTICES.md dist/StagePane.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          cmp -s TRADEMARKS.md dist/StagePane.app/Contents/Resources/TRADEMARKS.md
          cmp -s Assets/LICENSE.md dist/StagePane.app/Contents/Resources/BRAND_ASSET_LICENSE.md
          cmp -s docs/PRIVACY.md dist/StagePane.app/Contents/Resources/PRIVACY.md
          cmp -s docs/HELP.md dist/StagePane.app/Contents/Resources/HELP.md
          ABSOLUTE_RPATHS="$(otool -l dist/StagePane.app/Contents/MacOS/StagePane | awk '$1 == "cmd" && $2 == "LC_RPATH" { getline; getline; if ($2 ~ /^\//) print $2 }')"
          test -z "$ABSOLUTE_RPATHS"
          if nm -u "$BINARY" | grep -E '_(AXIsProcessTrusted|AXUIElement|AXValue|kAX)'; then
            echo "Local binary unexpectedly references cross-application Accessibility APIs" >&2
            exit 1
          fi
          if otool -L "$BINARY" | grep -F 'ApplicationServices.framework'; then
            echo "Local binary unexpectedly links ApplicationServices directly" >&2
            exit 1
          fi
          if strings "$BINARY" | grep -E 'Press Buttons|Button Press|ボタン操作|Continue Setup|設定を続ける|AXPress|PreviewInput'; then
            echo "Local binary contains removed button-control UI or implementation strings" >&2
            exit 1
          fi
          if nm -u "$BINARY" | grep -E '_(CGEventPost|CGEventCreateMouseEvent|CGEventCreateKeyboardEvent|CGEventTapCreate|CGWarpMouseCursorPosition|CGAssociateMouseAndMouseCursorPosition)'; then
            echo "Local binary unexpectedly references raw input injection APIs" >&2
            exit 1
          fi
          SNAPSHOT_PARENT="$HOME/Library/Containers/com.hinoshiba.stagepane/Data/tmp"
          mkdir -p "$SNAPSHOT_PARENT"
          SNAPSHOT_DIR="$(mktemp -d "$SNAPSHOT_PARENT/stagepane-ci-shots.XXXXXX")"
          STAGEPANE_LANGUAGE=en "$BINARY" --snapshot "$SNAPSHOT_DIR"
          for NAME in workspace arrange draw sources permissions privacy appearance; do
            test -s "$SNAPSHOT_DIR/$NAME.png"
            test "$(sips -g pixelWidth "$SNAPSHOT_DIR/$NAME.png" | awk '/pixelWidth/ { print $2 }')" = 2880
            test "$(sips -g pixelHeight "$SNAPSHOT_DIR/$NAME.png" | awk '/pixelHeight/ { print $2 }')" = 1800
          done
          for NAME in privacy-curtain stage-ready; do
            test -s "$SNAPSHOT_DIR/$NAME.png"
            test "$(sips -g pixelWidth "$SNAPSHOT_DIR/$NAME.png" | awk '/pixelWidth/ { print $2 }')" = 1920
            test "$(sips -g pixelHeight "$SNAPSHOT_DIR/$NAME.png" | awk '/pixelHeight/ { print $2 }')" = 1080
          done

      - name: Build checked-in Mac App Store project
        run: |
          xcodebuild \
            -project StagePane.xcodeproj \
            -scheme StagePane-AppStore \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/stagepane-mas-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Mac App Store build shape
        run: |
          APP="$RUNNER_TEMP/stagepane-mas-derived/Build/Products/Release/StagePane.app"
          BINARY="$APP/Contents/MacOS/StagePane"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = com.hinoshiba.stagepane
          test -s "$APP/Contents/Resources/AppIcon.icns"
          test -s "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test -s "$APP/Contents/Resources/en.lproj/InfoPlist.strings"
          test -s "$APP/Contents/Resources/ja.lproj/InfoPlist.strings"
          cmp -s LICENSE "$APP/Contents/Resources/LICENSE.txt"
          cmp -s NOTICE "$APP/Contents/Resources/NOTICE.txt"
          cmp -s THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md"
          cmp -s TRADEMARKS.md "$APP/Contents/Resources/TRADEMARKS.md"
          cmp -s Assets/LICENSE.md "$APP/Contents/Resources/BRAND_ASSET_LICENSE.md"
          cmp -s docs/APP_STORE_PRIVACY.md "$APP/Contents/Resources/PRIVACY.md"
          cmp -s docs/APP_STORE_HELP.md "$APP/Contents/Resources/HELP.md"
          if nm -u "$BINARY" | grep -E '_(AXIsProcessTrusted|AXUIElement|AXValue|kAX)'; then
            echo "Mac App Store binary unexpectedly references cross-application Accessibility APIs" >&2
            exit 1
          fi
          if otool -L "$BINARY" | grep -F 'ApplicationServices.framework'; then
            echo "Mac App Store binary unexpectedly links ApplicationServices directly" >&2
            exit 1
          fi
          if strings "$BINARY" | grep -E 'Press Buttons|Button Press|ボタン操作|Continue Setup|設定を続ける|AXPress|PreviewInput'; then
            echo "Mac App Store binary contains removed button-control UI or implementation strings" >&2
            exit 1
          fi
          if nm -u "$BINARY" | grep -E '_(CGEventPost|CGEventCreateMouseEvent|CGEventCreateKeyboardEvent|CGEventTapCreate|CGWarpMouseCursorPosition|CGAssociateMouseAndMouseCursorPosition)'; then
            echo "Mac App Store binary unexpectedly references raw input injection APIs" >&2
            exit 1
          fi
          ARCHS="$(lipo -archs "$BINARY")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          MACHO_COUNT=0
          while IFS= read -r -d '' CANDIDATE; do
            if file "$CANDIDATE" | grep -q 'Mach-O'; then
              MACHO_COUNT=$((MACHO_COUNT + 1))
              ABSOLUTE_RPATHS="$(otool -l "$CANDIDATE" | awk '$1 == "cmd" && $2 == "LC_RPATH" { getline; getline; if ($2 ~ /^\//) print $2 }')"
              test -z "$ABSOLUTE_RPATHS"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          test "$MACHO_COUNT" -ge 1
          codesign --force --options runtime --entitlements StagePane.entitlements --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/mas-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/mas-entitlements.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' "$RUNNER_TEMP/mas-entitlements.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$RUNNER_TEMP/mas-entitlements.plist" 2>/dev/null || true)" != true
